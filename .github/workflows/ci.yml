name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for secrets in tracked files
        run: |
          if git ls-files -I -i -c --exclude-standard | xargs -r grep -lE "(GEMINI_API_KEY|ANTHROPIC_API_KEY|OPENAI_API_KEY|sk-[A-Za-z0-9]{20,})"; then
            echo "::error::secret scan failed"
            exit 1
          fi

  frontend-typecheck:
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  backend-test:
    runs-on: ubuntu-latest
    needs: secret-scan
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest
